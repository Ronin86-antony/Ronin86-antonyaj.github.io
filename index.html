<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronin's PDF Merger</title>
    <meta name="description" content="A premium, fast, and secure client-side PDF merger.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- PDF-Lib for merging -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
    <div class="background-elements">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>

    <main class="app-container">
        <header>
            <h1 class="title">Ronin's <span class="gradient-text">PDF Merger</span></h1>
            <p class="subtitle">Combine your documents seamlessly and securely in your browser.</p>
        </header>

        <section class="upload-section" id="drop-zone">
            <div class="upload-content">
                <svg class="upload-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7 10V9C7 6.23858 9.23858 4 12 4C14.7614 4 17 6.23858 17 9V10C19.2091 10 21 11.7909 21 14C21 15.4806 20.1956 16.8084 19 17.5M7 10C4.79086 10 3 11.7909 3 14C3 15.4806 3.8044 16.8084 5 17.5M7 10C7.43285 10 7.84965 10.0688 8.24006 10.1959M12 12V21M12 12L15 15M12 12L9 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h2>Drag & Drop PDFs here</h2>
                <p>or</p>
                <label for="file-input" class="btn-primary">Browse Files</label>
                <input type="file" id="file-input" accept="application/pdf" multiple hidden>
            </div>
        </section>

        <section class="list-section" id="list-section" style="display: none;">
            <div class="list-header">
                <h3>Selected Files <span id="file-count">(0)</span></h3>
                <button id="clear-all" class="btn-text">Clear All</button>
            </div>
            <ul id="file-list" class="file-list">
                <!-- File items will be inserted here -->
            </ul>
        </section>

        <section class="action-section">
            <button id="merge-btn" class="btn-primary btn-large" disabled>
                <span class="btn-text-content">Merge PDFs</span>
                <div class="spinner" id="merge-spinner" style="display: none;"></div>
            </button>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
